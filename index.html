function lobbyHTML(){return `<h3>MULTIPLAYER</h3><div class=row><input id=nk value="${nick}" maxlength=10 placeholder="Your name" oninput="nick=clean(this.value)||'Player';try{localStorage.setItem(KEY+'_nick',nick)}catch(e){};lobPres()" style="${IS}"><input id=rn value="${room?rcode:''}" maxlength=12 placeholder="Room name" style="${IS}"><button class=b onclick="createRoom()">+ CREATE ROOM</button>${room?'<button class=b onclick="leaveRoom()">LEAVE</button>':''}</div><div class=hint id=ostx>${room?ost:(lobS||'Not in a room')}</div><h3>PUBLIC ROOMS</h3><div id=rl></div>`}
async function createRoom(){const v=clean($('rn').value).trim().toLowerCase();rcode=v||'room'+(100+Math.random()*900|0);await goOnline();lobPres();rl()}
async function joinRoom(r){rcode=r;await goOnline();lobPres()}
function leaveRoom(){if(room){try{room.leave()}catch(e){}room=null}RP.forEach(r=>sc.remove(r.g));RP.clear();ost='Offline';lobPres();render()}
// scenery
const crT=ctex(64,64,(x,w,h)=>{x.fillStyle='#a8793f';x.fillRect(0,0,w,h);x.strokeStyle='#5a3d1c';x.lineWidth=4;x.strokeRect(2,2,w-4,h-4);x.beginPath();x.moveTo(0,0);x.lineTo(w,h);x.moveTo(w,0);x.lineTo(0,h);x.stroke()});
[[-3,12],[3,-13],[20,-4],[-20,-6],[-11,3],[12,-2],[4,16],[-4,-15],[18,20],[-19,22]].forEach(a=>box(a[0],a[1],1.6,1.6,1.6,0xffffff,crT));
const g2=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshLambertMaterial({color:0x3f6a3a}));g2.rotation.x=-Math.PI/2;g2.position.y=-.03;sc.add(g2);
const tm=new THREE.MeshLambertMaterial({color:0x2f6b36}),tk=new THREE.MeshLambertMaterial({color:0x5b3a1e});
for(let i=0;i<26;i++){const a=i/26*Math.PI*2+rnd(-.1,.1),r=rnd(38,52),g=new THREE.Group(),k=new THREE.Mesh(new THREE.CylinderGeometry(.4,.5,3,6),tk),c=new THREE.Mesh(new THREE.ConeGeometry(2.2,7,7),tm);k.position.y=1.5;c.position.y=6;k.castShadow=c.castShadow=true;g.add(k,c);g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);g.scale.setScalar(rnd(.8,1.5));sc.add(g)}
const cT=ctex(64,64,(x,w,h)=>{const g=x.createRadialGradient(32,32,2,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(1,'#fff0');x.fillStyle=g;x.fillRect(0,0,w,h)});
for(let i=0;i<10;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cT,fog:false,depthWrite:false,opacity:.8}));s.scale.set(rnd(25,45),rnd(8,14),1);const a=rnd(0,6.28);s.position.set(Math.cos(a)*rnd(50,90),rnd(30,50),Math.sin(a)*rnd(50,90));sc.add(s)}
const kn=c=>c.replace('Key','').replace('Digit','').replace('Left',' L').replace('Right',' R');
function keysHTML(){return `<h3>CONTROLS — click an action, then press the new key (Esc cancels)</h3><div class=g>${Object.keys(LB).map(k=>`<div>${LB[k]}<br><button class="b ${rebind==k?'on':''}" onclick="rebind='${k}';render()">${rebind==k?'press a key…':kn(B[k])}</button></div>`).join('')}</div><h3>MOUSE SENSITIVITY <span id=sv>${sens.toFixed(1)}</span>×</h3><input type=range min=.3 max=3 step=.1 value=${sens} oninput="sens=+this.value;$('sv').textContent=sens.toFixed(1);saveK()" style="width:100%"><button class=b style="margin-top:10px" onclick="B=Object.assign({},DB);saveK();render()">Reset to default</button><h3>COMMENTATOR</h3><button class=b onclick="voice=!voice;if(!voice&&window.speechSynthesis)speechSynthesis.cancel();saveK();render()">Voice: ${voice?'ON':'OFF'}</button><p class=hint>Fire = left mouse · Aim / scope = hold right mouse.</p>`}
addEventListener('keydown',e=>{if(rebind){e.preventDefault();if(e.code!='Escape'){B[rebind]=e.code;saveK()}rebind=null;render();return}if(e.target.tagName=='INPUT')return;if(e.code==B.mute){mute=!mute;return}if(!playing)return;kd[e.code]=1;if(e.code==B.score){e.preventDefault();$('sb').style.display='block';$('sb').innerHTML=sbHTML()}if(e.code==B.reload)reload();for(let i=1;i<=5;i++)if(e.code==B['w'+i]){M.w=i-1;M.rl=0;gunCol();sfx('swap')}});
const kd={};addEventListener('keyup',e=>{kd[e.code]=0;if(e.code==B.score)$('sb').style.display='none'});
addEventListener('mousedown',e=>{if(e.button==2){ads=1;return}mouse=1;shoot()});addEventListener('mouseup',e=>{if(e.button==2)ads=0;else mouse=0});addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{if(!locked)return;const fs=sens*cam.fov/75;P.yaw-=e.movementX*.0022*fs;P.pitch=Math.max(-1.45,Math.min(1.45,P.pitch-e.movementY*.0022*fs))});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===R.domElement;$('pause').style.display=playing&&!locked?'flex':'none'});
$('pause').onclick=()=>R.domElement.requestPointerLock();
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
addEventListener('beforeunload',save);
// loop
function upd(dt){M.t-=dt;S.time+=dt;aimOn=ads&&M.alive&&!M.rl&&locked?1:0;if(!M.c60&&M.t<60&&dur>1){M.c60=1;cmSay('min1',1)}if(!M.c30&&M.t<30){M.c30=1;cmSay('s30',1)}if(M.t<10&&Math.ceil(M.t)!=M.ct){M.ct=Math.ceil(M.t);sfx('tick')}if((M.ic-=dt)<=0){M.ic=rnd(18,30);cmSay('idle')}
if(M.alive){const f=(kd[B.fwd]?1:0)-(kd[B.back]?1:0),s=(kd[B.right]?1:0)-(kd[B.left]?1:0),l=Math.hypot(f,s)||1,sp=(kd[B.sprint]&&!aimOn?8:5)*(aimOn?.6:1)*(1+.03*S.up.spd)*dt;moving=f||s;
const dx=(-Math.sin(P.yaw)*f+Math.cos(P.yaw)*s)/l*sp,dz=(-Math.cos(P.yaw)*f-Math.sin(P.yaw)*s)/l*sp;mv(P,dx,dz,.45);S.dist+=Math.hypot(dx,dz);
if(kd[B.jump]&&P.y<=0){P.vy=7;S.jumps++;sfx('jump')}P.vy-=20*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y==0){if(P.vy<-5)sfx('land');P.vy=0}
if(M.rl>0){M.rl-=dt;if(M.rl<=0){M.rl=0;M.ammo[M.w]=W[M.w].m}}if(mouse&&W[M.w].a)shoot();
if(now-M.lt>5&&M.hp<maxHP())M.hp=Math.min(maxHP(),M.hp+15*dt)}
else{M.rs-=dt;if(M.rs<=0){const s=spot();P.x=s[0];P.z=s[1];M.alive=true;M.hp=maxHP();M.ammo=W.map(w=>w.m);M.rl=0;sfx('spawn');cmSay('respawn')}}
if(moving&&P.y==0)bobT+=dt*(kd[B.sprint]?14:9);if(moving&&P.y==0&&(stepT-=dt)<=0){stepT=kd[B.sprint]&&!aimOn?.28:.45;sfx('step')}cam.position.set(P.x,1.6+P.y+(moving&&P.y==0?Math.sin(bobT)*.04:0),P.z);cam.rotation.set(P.pitch,P.yaw,0);cam.fov+=((aimOn?ZM[M.w]:(kd[B.sprint]&&moving?82:75))-cam.fov)*Math.min(1,dt*10);cam.updateProjectionMatrix();
bots.forEach(b=>botAI(b,dt));
coins.forEach((c,i)=>{c.rotation.y+=dt*3;c.position.y=.9+Math.sin(now*3+i)*.12;if(M.alive&&Math.hypot(c.position.x-P.x,c.position.z-P.z)<1.3){S.coins++;cash(10);addXP(5);sfx('coin');place(c)}});
if(room&&(pt-=dt)<=0){pt=.12;room.presence({x:P.x,z:P.z,y:P.y,ya:P.yaw,hp:M.hp,al:M.alive?1:0,k:M.k,d:M.d,n:nick,w:M.w})}
if(M.t<=0)end()}
function hud(){const w=W[M.w],t=Math.max(0,M.t)|0;$('rlb').style.display=M.rl?'block':'none';$('rlb').firstChild.style.width=(M.rl?(1-M.rl/w.rl)*100:0)+'%';$('scope').style.display=aimOn&&M.w==4?'block':'none';$('ch').style.opacity=aimOn&&M.w==4?0:.8;if(M.hp<30&&M.alive&&!M.lowc){M.lowc=1;cmSay('low')}if(M.hp>60)M.lowc=0;const cdp=M.rl?1:Math.min(1,(now-(M.nf-w.r))/w.r),cds=M.alive&&cdp<1&&w.r>=.2;$('cd').style.display=cds?'block':'none';if(cds){$('cd').firstChild.style.width=cdp*100+'%';$('cd').lastChild.textContent=w.r>=.5?Math.max(0,M.nf-now).toFixed(1)+'s':''}$('tm').textContent=(t/60|0)+':'+String(t%60).padStart(2,'0');
$('st').innerHTML=`KILLS ${M.k}<br>DEATHS ${M.d}<br>STREAK ${M.streak}<br>HS ${M.hs}${room?'<br>PLAYERS '+(RP.size+1):''}`;
$('bl').innerHTML=`HP ${Math.ceil(M.hp)}<div class=bar style="margin:2px 0 6px"><i style="width:${Math.max(0,M.hp/maxHP()*100)}%;background:#e33"></i></div>LVL ${S.level}<div class=bar style="margin-top:2px"><i style="width:${S.xp/need(S.level)*100}%"></i></div>`;
$('br').innerHTML=`<span style="color:#ffd700">$${fmt(S.money)}</span><br>${w.n}<br><span style="font-size:26px;color:${M.ammo[M.w]<=w.m*.25?'#f55':'#fff'}">${M.rl?'RELOADING…':M.ammo[M.w]}</span> / ${w.m}`;
$('msg').textContent=M.alive?'':'YOU DIED — respawn in '+Math.ceil(M.rs);
$('fl').style.opacity=Math.max(0,.7-(now-M.lt)*1.4);$('hm').style.opacity=hmv;hmv=Math.max(0,hmv-.1);
if(fr%8==0)$('feed').innerHTML=fl.filter(f=>now-f.t<5).slice(0,5).map(f=>f.x).join('<br>');if($('sb').style.display=='block'&&fr%10==0)$('sb').innerHTML=sbHTML()}
function loop(){requestAnimationFrame(loop);const t=performance.now(),dt=Math.min(.05,(t-last)/1000);last=t;fr++;fxUpd(dt);remotes(dt);
if(playing){gun.visible=M.alive&&!(aimOn&&M.w==4);if(locked){now+=dt;upd(dt)}recoil=Math.max(0,recoil-dt*8);gun.position.z=-.55+recoil*.08;const rlp=M.rl>0?Math.sin((1-M.rl/W[M.w].rl)*Math.PI):0;gun.position.x+=((aimOn?0:.25)-gun.position.x)*Math.min(1,dt*14);gun.position.y=(aimOn?-.17:-.22)+(moving&&P.y==0&&!aimOn?Math.sin(bobT)*.012:0)-rlp*.25;gun.rotation.x=rlp*.7;mflashT-=dt;mfl.visible=mflashT>0;hud()}
else{gun.visible=false;now+=dt;const a=now*.15;cam.position.set(Math.cos(a)*24,11,Math.sin(a)*24);cam.lookAt(0,0,0)}
R.render(sc,cam)}
load();menu();loop();
